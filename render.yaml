# Render 배포 설정 (Blueprint). Render 대시보드에서 New → Blueprint → 이 저장소를 고르면 아래대로 만들어져요.
# sync: false 인 값은 이 파일에 적지 않고, 배포할 때 Render 화면에서 직접 입력해요.
services:
  - type: web
    name: setsign
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BANK_NAME            # 입금받을 은행 이름 (예: ○○은행)
        sync: false
      - key: BANK_ACCOUNT         # 계좌번호
        sync: false
      - key: BANK_HOLDER          # 예금주
        sync: false
      - key: ADMIN_TOKEN          # 주문 관리 페이지(/admin.html) 비밀번호. 길고 추측하기 어렵게
        sync: false
      - key: SHOW_VERIFY_CODE     # 테스트용: 인증 코드를 메일 대신 화면에 표시. 실제 운영 전에 지우세요
        value: "1"
