# Render Blueprint — New → Blueprint 로 이 저장소를 고르면 아래 설정으로 서버가 만들어져요.
# 계좌·비밀번호·API 키 같은 값은 이 파일에 적지 않아요 (공개 저장소).
# sync: false 인 값은 Render 대시보드 → Environment 에서 직접 넣고, 이후 배포해도 덮어쓰지 않아요.
services:
  - type: web
    name: setsign
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BANK_NAME
        sync: false
      - key: BANK_ACCOUNT
        sync: false
      - key: BANK_HOLDER
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
